# Lokale Entwicklung: `supabase start` hebt Postgres, Auth, Storage und die
# Edge-Runtime hoch. Deployment: `supabase db push`.
project_id = "myclub-nexus"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Nur für die **lokale** Instanz. Im verknüpften Projekt muss `site_url` die
# betriebene Adresse sein (https://app.my-club.ch) – `supabase config push`
# würde sie mit dem Wert dieser Zeile überschreiben und jeden Magic Link auf
# den Entwicklungsrechner umleiten. Vor einem Push also site_url prüfen.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "ch.myclub.nexus://auth/callback",
  # Die betriebene PWA. `env.webRedirectUrl` fällt auf `window.location.origin`
  # zurück, der Magic Link kehrt also hierhin zurück – ohne diesen Eintrag
  # weist GoTrue ihn ab. Dieselbe Adresse steht im Dashboard des verknüpften
  # Projekts und als Secret `APP_URL` der Function `send-mail` (UC-044).
  "https://app.my-club.ch/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Kein Google-/Apple-Login: Magic Link ist der Standardweg (Architektur §3.2).

# Der Import der Website-News prüft den Aufrufer selbst: `is_club_admin()` für
# den Vorstand, die Rolle `service_role` für den nächtlichen Abgleich. Das
# geprüfte JWT ist die Voraussetzung dafür und bleibt deshalb Pflicht.
[functions.import-wordpress-news]
verify_jwt = true
