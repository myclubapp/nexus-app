# Lokale Entwicklung: `supabase start` hebt Postgres, Auth, Storage und die
# Edge-Runtime hoch. Deployment: `supabase db push`.
project_id = "myclub-nexus"

[api]
enabled = true
port = 54321
# `graphql_public` steht am verknüpften Projekt und wird von `config push`
# entfernt, wenn es hier fehlt – die Liste ist deklarativ, nicht additiv.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Die betriebene Adresse. Diese Datei ist der deklarative Stand **auch für das
# verknüpfte Projekt** (`supabase config push`); ein Entwicklungswert hier
# würde jeden Magic Link auf einen Entwicklungsrechner umleiten.
#
# `site_url` ist nur die Rückfalladresse. Die App nennt ihr Ziel bei jeder
# Anmeldung selbst (`authRedirectUrl()`), und die lokale Entwicklung steht
# unten auf der Erlaubnisliste – deshalb funktioniert `supabase start` mit
# diesem Wert unverändert.
site_url = "https://app.my-club.ch"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "ch.myclub.nexus://auth/callback",
  # Die betriebene PWA. `env.webRedirectUrl` fällt auf `window.location.origin`
  # zurück, der Magic Link kehrt also hierhin zurück – ohne diesen Eintrag
  # weist GoTrue ihn ab und schickt die Person auf `site_url`. Dieselbe
  # Adresse steht als Secret `APP_URL` der Function `send-mail` (UC-044).
  "https://app.my-club.ch/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Kein Google-/Apple-Login: Magic Link ist der Standardweg (Architektur §3.2).

# ---------------------------------------------------------------------------
# UC-048: Die Anmeldemails verschickt der Verein selbst.
#
# Ohne diesen Hook baut GoTrue die Mail aus seiner eigenen Vorlage: englisch,
# ohne Vereinsfarbe, ohne Logo, ohne Erklärung, warum sie kommt. Mit ihm reicht
# GoTrue Anlass, Person und Token an die Function `auth-mail` weiter, die
# daraus dasselbe Blatt baut wie jede andere Mail des Vereins.
#
# **Diese Function steht auf dem Weg zur Anmeldung.** Fällt sie aus, bekommt
# niemand mehr einen Link; `enabled = false` gibt den Versand sofort an GoTrue
# zurück. Das Secret ist dasselbe, das in den Function-Secrets als
# `SEND_EMAIL_HOOK_SECRET` steht (Form: `v1,whsec_<base64>`).
#
# Die Adresse zeigt auf das betriebene Projekt, wie `site_url` oben: Diese
# Datei ist der deklarative Stand **auch für das verknüpfte Projekt**. Für die
# lokale Entwicklung mit `supabase start` hier auf
# `http://host.docker.internal:54321/functions/v1/auth-mail` umstellen – und
# vor dem nächsten `config push` zurückdrehen.
[auth.hook.send_email]
enabled = true
uri = "https://wrtbfmzpoahgjvecbpzh.supabase.co/functions/v1/auth-mail"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Der Import der Website-News prüft den Aufrufer selbst: `is_club_admin()` für
# den Vorstand, die Rolle `service_role` für den nächtlichen Abgleich. Das
# geprüfte JWT ist die Voraussetzung dafür und bleibt deshalb Pflicht.
[functions.import-wordpress-news]
verify_jwt = true

# UC-046 und UC-047: Beide prüfen **selbst**, ob die aufrufende Person Vorstand
# dieses Vereins ist (`is_club_admin` mit ihrem Token). `verify_jwt` davor ist
# die erste Hürde: Ohne gültiges Token kommt der Aufruf gar nicht an.
[functions.invoice-run]
verify_jwt = true

[functions.payment-import]
verify_jwt = true

# UC-048: Der Hook «Send Email». GoTrue schickt kein JWT, sondern signiert den
# Rumpf nach «Standard Webhooks» – die Function prüft diese Signatur selbst und
# weist ohne sie mit 401 ab. `verify_jwt = true` würde den Hook aussperren.
[functions.auth-mail]
verify_jwt = false

# UC-050: Die Vorschau des Vereins-Pulses (FR-189). Sie liest mit dem Token der
# Aufruferin, und die Policy aus `0044` entscheidet – Entwürfe sieht nur der
# Vorstand. `verify_jwt` davor ist die erste Hürde; eine Vorschau ohne
# angemeldete Person gibt es nicht.
[functions.pulse-preview]
verify_jwt = true
